<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystarsnight Clicker (Global!)</title><style>*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui,sans-serif}.app{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:clamp(20px,5vw,34px);font-weight:900}.sub{color:#8b8b96;font-size:13px}.grid{display:grid;grid-template-columns:1fr 360px;gap:22px;margin-top:20px}.card{background:#111116;border:1px solid #24242c;border-radius:24px;padding:22px}.center{text-align:center}.count{font-size:clamp(58px,14vw,130px);font-weight:950;line-height:1;margin:18px 0;letter-spacing:-.06em}.button{width:min(65vw,300px);height:min(65vw,300px);border:0;border-radius:50%;font-size:38px;font-weight:950;background:linear-gradient(145deg,#fff,#999);box-shadow:0 20px 60px #000,inset 0 8px 15px #fff,inset 0 -12px 20px #666;cursor:pointer}.button:active{transform:scale(.94)}.status{margin:18px;color:#999}.shop{max-height:620px;overflow:auto}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid #292930}.item b{display:block}.item small{color:#888}.buy{border:1px solid #444;background:#19191f;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.buy:hover{background:#292930}.buy:disabled{opacity:.4;cursor:not-allowed}.stats{display:flex;justify-content:space-around;color:#aaa;margin-top:20px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:0;background:#222229;color:#aaa;padding:10px 14px;border-radius:10px}.tab.active{color:#fff;background:#444}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.shop{max-height:none}}</style></head><body><main class="app"><header class="top"><div><div class="brand">Mystarsnight Clicker (Global!)</div><div class="sub">One button. Everyone. One global counter.</div></div><div id="status" class="sub">Connecting…</div></header><section class="grid"><div class="card center"><div class="sub">GLOBAL CLICKS</div><div id="count" class="count">0</div><button id="button" class="button">CLICK!</button><div class="stats"><span>Presses: <b id="presses">0</b></span><span>Your coins: <b id="coins">0</b></span></div></div><aside class="card"><div class="tabs"><button class="tab active">SHOP</button><button class="tab">BOOSTS</button></div><div id="shop" class="shop"></div></aside></section></main><script>
const WORKER_URL='YOUR_CLOUDFLARE_WORKER_URL';let count=0,presses=0,coins=Number(localStorage.coins||0),items=[];const $=id=>document.getElementById(id);$('coins').textContent=coins.toLocaleString();
const fallback=[['double','2× Clicks','Double your clicks for 30 seconds.',100],['turbo','Turbo Click','5 clicks per press for 20 seconds.',500],['lucky','Lucky Click','Chance for bonus clicks.',1200],['gold','Golden Button','+10 bonus clicks per press.',5000],['mega','Mega Click','Instant +100 clicks.',10000],['auto','Auto Clicker','Passive clicking boost.',25000],['rainbow','Rainbow Mode','Unlocks a wild theme.',50000],['combo','Combo Booster','Build bigger combos.',75000],['storm','Click Storm','Huge global event.',150000],['portal','Click Portal','Unlock a mysterious portal.',300000],['galaxy','Galaxy Button','Unlock galaxy styling.',750000],['infinity','Infinity Click','Massive click bonus.',1500000]];
async function api(path,opt){if(WORKER_URL.includes('YOUR_'))return null;let r=await fetch(WORKER_URL+path,opt);if(!r.ok)throw Error();return r.json()}
function drawShop(){let a=items.length?items:fallback;$('shop').innerHTML=a.map(x=>`<div class="item"><div><b>${x[1]}</b><small>${x[2]}</small></div><button class="buy" data-price="${x[3]}">${x[3].toLocaleString()} coins</button></div>`).join('');document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>buy(+b.dataset.price));}
function buy(price){if(coins<price)return alert('Not enough coins!');coins-=price;localStorage.coins=coins;$('coins').textContent=coins.toLocaleString();}
async function load(){try{let d=await api('/count');if(d){count=d.clicks;presses=d.presses;let s=await api('/shop');items=s.items||[];$('status').textContent='LIVE • Cloudflare';}}catch(e){$('status').textContent='Offline mode'}$('count').textContent=count.toLocaleString();$('presses').textContent=presses.toLocaleString();drawShop()}
async function click(){coins++;localStorage.coins=coins;$('coins').textContent=coins.toLocaleString();try{let d=await api('/press',{method:'POST'});if(d){count=d.clicks;presses=d.presses}}catch(e){count++;presses++} $('count').textContent=count.toLocaleString();$('presses').textContent=presses.toLocaleString()}
$('button').onclick=click;load();setInterval(load,5000);
</script></body></html>
